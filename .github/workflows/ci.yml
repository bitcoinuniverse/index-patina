name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the indexer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Verify vendored package
        run: npm run verify:vendor

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Command line smoke test
        env:
          PATINA_NETWORK: regtest
          PATINA_RPC_OFFLINE: 'true'
          PATINA_DATA_DIR: ${{ runner.temp }}/patina-ci
          PATINA_LOG_LEVEL: silent
        run: |
          node bin/index-patina.mjs status --json
          node bin/index-patina.mjs verify

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the indexer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the image
        run: docker build -t index-patina:ci .

      - name: Run the command line inside the image
        run: |
          docker run --rm -e PATINA_NETWORK=regtest -e PATINA_RPC_OFFLINE=true \
            -e PATINA_LOG_LEVEL=silent index-patina:ci status --json
